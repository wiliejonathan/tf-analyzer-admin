<!-- SKILL FUSION MEMBER LOGIN WIDGET — REV315 -->
<div class="sfm-auth" id="sfmAuthWidget">
  <div class="sfm-auth__card">
    <div class="sfm-auth__top">
      <div>
        <span class="sfm-auth__eyebrow">SKILL FUSION MEMBER</span>
        <h3 id="sfmTitle">Login Member</h3>
        <p id="sfmSubtitle">Masuk menggunakan Google Account yang sudah disetujui atau terdaftar di TF Analyzer.</p>
      </div>
      <span class="sfm-auth__secure">● Secure</span>
    </div>
    <div class="sfm-auth__tabs" role="tablist">
      <button class="active" type="button" data-sfm-mode="login">Login</button>
      <button type="button" data-sfm-mode="register">Register</button>
    </div>
    <div class="sfm-auth__body">
      <div id="sfmGoogleButton" class="sfm-auth__google"></div>
      <div id="sfmLoading" class="sfm-auth__loading" hidden><span></span><b>Memverifikasi Google Account...</b></div>
      <div id="sfmMessage" class="sfm-auth__message" hidden></div>
      <p class="sfm-auth__note" id="sfmNote">Email yang sudah ada di TF Analyzer License Database otomatis ACTIVE.</p>
    </div>
  </div>
</div>
<style>
.sfm-auth,.sfm-auth *{box-sizing:border-box}.sfm-auth{--panel:#151817;--line:#2b312e;--text:#f3f6f4;--muted:#9aa39f;--green:#16c878;--warn:#f0b94a;--danger:#ff6f7b;width:100%;max-width:520px;margin:0 auto;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sfm-auth__card{width:100%;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,var(--panel),#111412);box-shadow:0 18px 60px rgba(0,0,0,.28)}.sfm-auth__top{display:flex;justify-content:space-between;gap:14px;padding:22px 22px 16px}.sfm-auth__eyebrow{display:block;margin-bottom:5px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.14em}.sfm-auth h3{margin:0;color:#fff;font-size:clamp(20px,4.5vw,27px);line-height:1.15;letter-spacing:-.035em}.sfm-auth__top p{margin:7px 0 0;max-width:390px;color:var(--muted);font-size:12px;line-height:1.5}.sfm-auth__secure{flex:0 0 auto;align-self:flex-start;padding:5px 8px;border:1px solid rgba(22,200,120,.24);border-radius:999px;color:#47e89f;background:rgba(22,200,120,.08);font-size:9px;font-weight:800}.sfm-auth__tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 22px;padding:4px;border:1px solid var(--line);border-radius:11px;background:#0f1211}.sfm-auth__tabs button{min-height:37px;border:0;border-radius:8px;color:#89938f;background:transparent;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.sfm-auth__tabs button.active{color:#fff;background:#242a27;box-shadow:inset 0 0 0 1px #303834}.sfm-auth__body{padding:18px 22px 22px}.sfm-auth__google{min-height:44px;display:flex;justify-content:center;align-items:center;overflow:hidden;border-radius:8px}.sfm-auth__loading{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;color:#c7d0cc;font-size:11px}.sfm-auth__loading span{width:16px;height:16px;border:2px solid #35413b;border-top-color:var(--green);border-radius:50%;animation:sfmSpin .75s linear infinite}@keyframes sfmSpin{to{transform:rotate(360deg)}}.sfm-auth__message{margin-top:13px;padding:10px 11px;border:1px solid rgba(22,200,120,.24);border-radius:9px;color:#aef1cf;background:rgba(22,200,120,.07);font-size:11px;line-height:1.45}.sfm-auth__message.warn{border-color:rgba(240,185,74,.28);color:#f1d69d;background:rgba(240,185,74,.07)}.sfm-auth__message.error{border-color:rgba(255,111,123,.28);color:#ffc1c6;background:rgba(255,111,123,.07)}.sfm-auth__note{margin:13px 0 0;color:#707b76;text-align:center;font-size:10px;line-height:1.45}@media(max-width:480px){.sfm-auth__top{padding:18px 16px 14px}.sfm-auth__tabs{margin:0 16px}.sfm-auth__body{padding:16px}.sfm-auth__secure{display:none}}
</style>
<script>
(()=>{"use strict";
const cfg={apiUrl:"https://script.google.com/macros/s/AKfycbzUbx40vGvuCS4hQEOdfs-DeSU_TY-9zWXXPZzOKn3D9h0m5pQQYD6GGNCefufvsrv2eA/exec",googleClientId:"115969098046-alnc03479m380nhjk9n0fqtqhboa0081.apps.googleusercontent.com",redirectUrl:"https://skillfusion.framer.website/Memberarea"};
const root=document.getElementById("sfmAuthWidget"),title=document.getElementById("sfmTitle"),subtitle=document.getElementById("sfmSubtitle"),note=document.getElementById("sfmNote"),host=document.getElementById("sfmGoogleButton"),loading=document.getElementById("sfmLoading"),message=document.getElementById("sfmMessage");if(!root)return;let mode="login",gisReady=false;
function msg(t,type=""){message.textContent=t||"";message.className="sfm-auth__message"+(type?" "+type:"");message.hidden=!t}function busy(on){loading.hidden=!on;host.hidden=on}function setMode(next){mode=next==="register"?"register":"login";root.querySelectorAll("[data-sfm-mode]").forEach(b=>b.classList.toggle("active",b.dataset.sfmMode===mode));if(mode==="register"){title.textContent="Register Member";subtitle.textContent="Daftar dengan Google. Client TF Analyzer akan aktif otomatis.";note.textContent="Jika email tidak ada di TF Analyzer License Database, registrasi menunggu approval owner."}else{title.textContent="Login Member";subtitle.textContent="Masuk menggunakan Google Account.";note.textContent="Email yang sudah ada di TF Analyzer License Database otomatis ACTIVE."}msg("")}
async function api(command,data={}){const r=await fetch(cfg.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},cache:"no-store",redirect:"follow",body:JSON.stringify({action:"member_auth",command,...data})});const raw=await r.text();let p;try{p=JSON.parse(raw)}catch(_){throw new Error("Server member tidak mengembalikan JSON valid.")}if(!r.ok||p.success===false||p.ok===false){const e=new Error(p.message||p.error||p.code||"Login gagal.");e.payload=p;throw e}return p}
async function googleCredential(res){if(!res||!res.credential)return;busy(true);msg("");try{if(mode==="register"){const p=await api("register",{credential:res.credential});if(String(p.status).toUpperCase()==="ACTIVE")msg(p.autoActivated?"Email TF Analyzer terdeteksi. Akun Skill Fusion otomatis ACTIVE. Silakan Login.":"Akun sudah ACTIVE. Silakan Login.");else if(String(p.status).toUpperCase()==="SUSPENDED")msg("Akun sedang disuspend.","error");else msg("Registrasi berhasil. Menunggu persetujuan owner.","warn")}else{const p=await api("google_login",{credential:res.credential,userAgent:navigator.userAgent||""});sessionStorage.setItem("sf_member_session",String(p.sessionToken||""));sessionStorage.setItem("sf_member_expires_at",String(p.expiresAt||""));sessionStorage.setItem("sf_member_email",String(p.member&&p.member.email||""));msg(p.autoActivatedFromLicenseDb?"Client TF Analyzer terverifikasi. Login berhasil.":"Login berhasil. Membuka Member Area...");setTimeout(()=>location.assign(p.redirectUrl||cfg.redirectUrl),350)}}catch(e){const c=String(e&&e.payload&&e.payload.code||"");if(c==="PENDING_APPROVAL")msg("Akun masih menunggu persetujuan owner.","warn");else if(c==="ACCOUNT_SUSPENDED")msg("Akun sedang disuspend. Hubungi admin Skill Fusion.","error");else if(c==="MEMBER_REMOVED")msg("Akses member telah dihapus oleh owner.","error");else if(c==="NOT_REGISTERED")msg("Email belum terdaftar. Pilih Register terlebih dahulu.","warn");else msg(e.message||"Proses login gagal.","error")}finally{busy(false)}}
function render(){if(!window.google||!google.accounts||!google.accounts.id||gisReady)return;google.accounts.id.initialize({client_id:cfg.googleClientId,callback:googleCredential,auto_select:false,cancel_on_tap_outside:true,ux_mode:"popup"});host.innerHTML="";google.accounts.id.renderButton(host,{type:"standard",theme:"filled_black",size:"large",text:"continue_with",shape:"rectangular",width:Math.min(440,Math.max(260,host.clientWidth||360))});gisReady=true}
root.querySelectorAll("[data-sfm-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.sfmMode)));setMode("login");if(window.google&&window.google.accounts)render();else{const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;s.onload=render;s.onerror=()=>msg("Google Sign-In gagal dimuat. Coba refresh halaman.","error");document.head.appendChild(s)}})();
</script>
