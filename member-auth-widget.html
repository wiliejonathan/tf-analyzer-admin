<!--
  SKILL FUSION MEMBER LOGIN WIDGET — REV312
  Paste this entire block into your Framer / HTML widget.
  Before production, replace the 2 values in SF_MEMBER_WIDGET_CONFIG:
  1) apiUrl        = deployed Member_Skill_Fusion_Backend.gs /exec URL
  2) googleClientId = Google OAuth Web Client ID
-->
<div class="sfm-auth" id="sfmAuthWidget">
  <div class="sfm-auth__card">
    <div class="sfm-auth__top">
      <div>
        <span class="sfm-auth__eyebrow">SKILL FUSION MEMBER</span>
        <h3 id="sfmTitle">Login Member</h3>
        <p id="sfmSubtitle">Masuk menggunakan Google Account yang sudah disetujui owner.</p>
      </div>
      <span class="sfm-auth__secure" title="Google Account + owner approval">● Secure</span>
    </div>

    <div class="sfm-auth__tabs" role="tablist" aria-label="Member access">
      <button class="active" type="button" data-sfm-mode="login" role="tab" aria-selected="true">Login</button>
      <button type="button" data-sfm-mode="register" role="tab" aria-selected="false">Register</button>
    </div>

    <div class="sfm-auth__body">
      <div id="sfmGoogleButton" class="sfm-auth__google"></div>
      <div id="sfmLoading" class="sfm-auth__loading" hidden><span></span><b>Memverifikasi Google Account...</b></div>
      <div id="sfmMessage" class="sfm-auth__message" hidden></div>
      <p class="sfm-auth__note" id="sfmNote">Akses hanya diberikan untuk email yang berstatus ACTIVE.</p>
    </div>
  </div>
</div>

<style>
  .sfm-auth, .sfm-auth * { box-sizing: border-box; }
  .sfm-auth {
    --bg:#0c0f0e; --panel:#151817; --panel2:#1a1e1c; --line:#2b312e;
    --text:#f3f6f4; --muted:#9aa39f; --green:#16c878; --green2:#0ea965;
    --warn:#f0b94a; --danger:#ff6f7b;
    width:100%; max-width:520px; margin:0 auto; color:var(--text);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .sfm-auth__card {
    width:100%; overflow:hidden; border:1px solid var(--line); border-radius:18px;
    background:linear-gradient(145deg,var(--panel),#111412); box-shadow:0 18px 60px rgba(0,0,0,.28);
  }
  .sfm-auth__top { display:flex; justify-content:space-between; gap:14px; padding:22px 22px 16px; }
  .sfm-auth__eyebrow { display:block; margin-bottom:5px; color:var(--green); font-size:10px; font-weight:800; letter-spacing:.14em; }
  .sfm-auth h3 { margin:0; color:#fff; font-size:clamp(20px,4.5vw,27px); line-height:1.15; letter-spacing:-.035em; }
  .sfm-auth__top p { margin:7px 0 0; max-width:390px; color:var(--muted); font-size:12px; line-height:1.5; }
  .sfm-auth__secure { flex:0 0 auto; align-self:flex-start; padding:5px 8px; border:1px solid rgba(22,200,120,.24); border-radius:999px; color:#47e89f; background:rgba(22,200,120,.08); font-size:9px; font-weight:800; }
  .sfm-auth__tabs { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:0 22px; padding:4px; border:1px solid var(--line); border-radius:11px; background:#0f1211; }
  .sfm-auth__tabs button { min-height:37px; border:0; border-radius:8px; color:#89938f; background:transparent; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
  .sfm-auth__tabs button.active { color:#fff; background:#242a27; box-shadow:inset 0 0 0 1px #303834; }
  .sfm-auth__body { padding:18px 22px 22px; }
  .sfm-auth__google { min-height:44px; display:flex; justify-content:center; align-items:center; overflow:hidden; border-radius:8px; }
  .sfm-auth__loading { display:flex; align-items:center; justify-content:center; gap:9px; min-height:44px; color:#c7d0cc; font-size:11px; }
  .sfm-auth__loading span { width:16px; height:16px; border:2px solid #35413b; border-top-color:var(--green); border-radius:50%; animation:sfmSpin .75s linear infinite; }
  @keyframes sfmSpin { to { transform:rotate(360deg); } }
  .sfm-auth__message { margin-top:13px; padding:10px 11px; border:1px solid rgba(22,200,120,.24); border-radius:9px; color:#aef1cf; background:rgba(22,200,120,.07); font-size:11px; line-height:1.45; }
  .sfm-auth__message.warn { border-color:rgba(240,185,74,.28); color:#f1d69d; background:rgba(240,185,74,.07); }
  .sfm-auth__message.error { border-color:rgba(255,111,123,.28); color:#ffc1c6; background:rgba(255,111,123,.07); }
  .sfm-auth__note { margin:13px 0 0; color:#707b76; text-align:center; font-size:10px; line-height:1.45; }
  @media (max-width:480px) {
    .sfm-auth__top { padding:18px 16px 14px; }
    .sfm-auth__tabs { margin:0 16px; }
    .sfm-auth__body { padding:16px; }
    .sfm-auth__secure { display:none; }
  }
</style>

<script>
(() => {
  "use strict";

  window.SF_MEMBER_WIDGET_CONFIG = window.SF_MEMBER_WIDGET_CONFIG || {
    apiUrl: "PASTE_MEMBER_APPS_SCRIPT_EXEC_URL_HERE",
    googleClientId: "PASTE_GOOGLE_OAUTH_WEB_CLIENT_ID_HERE.apps.googleusercontent.com",
    redirectUrl: "https://skillfusion.framer.website/Memberarea"
  };

  const cfg = window.SF_MEMBER_WIDGET_CONFIG;
  const root = document.getElementById("sfmAuthWidget");
  if (!root) return;

  const title = document.getElementById("sfmTitle");
  const subtitle = document.getElementById("sfmSubtitle");
  const note = document.getElementById("sfmNote");
  const buttonHost = document.getElementById("sfmGoogleButton");
  const loading = document.getElementById("sfmLoading");
  const message = document.getElementById("sfmMessage");
  let mode = "login";
  let gisReady = false;

  function configured() {
    return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/i.test(String(cfg.apiUrl || "")) &&
      /\.apps\.googleusercontent\.com$/i.test(String(cfg.googleClientId || "")) &&
      !/PASTE_/i.test(String(cfg.apiUrl || "") + String(cfg.googleClientId || ""));
  }

  function showMessage(text, type = "") {
    message.textContent = text || "";
    message.className = "sfm-auth__message" + (type ? " " + type : "");
    message.hidden = !text;
  }

  function setBusy(on) {
    loading.hidden = !on;
    buttonHost.hidden = on;
  }

  function setMode(next) {
    mode = next === "register" ? "register" : "login";
    root.querySelectorAll("[data-sfm-mode]").forEach(btn => {
      const active = btn.dataset.sfmMode === mode;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });
    if (mode === "register") {
      title.textContent = "Register Member";
      subtitle.textContent = "Daftar menggunakan Google Account. Owner akan menerima email untuk approval.";
      note.textContent = "Setelah owner mengaktifkan email Anda, notifikasi aktivasi akan dikirim melalui email.";
    } else {
      title.textContent = "Login Member";
      subtitle.textContent = "Masuk menggunakan Google Account yang sudah disetujui owner.";
      note.textContent = "Akses hanya diberikan untuk email yang berstatus ACTIVE.";
    }
    showMessage("");
  }

  async function api(command, data) {
    const response = await fetch(cfg.apiUrl, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      cache: "no-store",
      redirect: "follow",
      body: JSON.stringify({ action: "member_auth", command, ...data })
    });
    const raw = await response.text();
    let payload;
    try { payload = JSON.parse(raw); }
    catch (_) { throw new Error("Server member tidak mengembalikan JSON yang valid."); }
    if (!response.ok || payload.success === false || payload.ok === false) {
      const err = new Error(payload.message || payload.error || payload.code || "Login gagal.");
      err.payload = payload;
      throw err;
    }
    return payload;
  }

  async function handleGoogleCredential(response) {
    if (!response || !response.credential) return;
    if (!configured()) {
      showMessage("Widget belum dikonfigurasi. Isi apiUrl dan googleClientId terlebih dahulu.", "error");
      return;
    }
    setBusy(true);
    showMessage("");
    try {
      if (mode === "register") {
        const result = await api("register", { credential: response.credential });
        const status = String(result.status || "PENDING").toUpperCase();
        if (status === "ACTIVE") {
          showMessage("Email ini sudah aktif. Silakan pindah ke tab Login.");
        } else if (status === "SUSPENDED") {
          showMessage("Email ini terdaftar tetapi sedang disuspend. Hubungi admin Skill Fusion.", "error");
        } else {
          showMessage("Registrasi berhasil. Akun menunggu persetujuan owner. Anda akan menerima email setelah diaktifkan.", "warn");
        }
      } else {
        const result = await api("google_login", {
          credential: response.credential,
          userAgent: navigator.userAgent || ""
        });
        sessionStorage.setItem("sf_member_session", String(result.sessionToken || ""));
        sessionStorage.setItem("sf_member_expires_at", String(result.expiresAt || ""));
        sessionStorage.setItem("sf_member_email", String(result.member && result.member.email || ""));
        showMessage("Login berhasil. Membuka Member Area...");
        const target = result.redirectUrl || cfg.redirectUrl || "https://skillfusion.framer.website/Memberarea";
        setTimeout(() => location.assign(target), 350);
      }
    } catch (err) {
      const code = String(err && err.payload && err.payload.code || "");
      if (code === "PENDING_APPROVAL") showMessage("Akun Anda masih menunggu persetujuan owner.", "warn");
      else if (code === "ACCOUNT_SUSPENDED") showMessage("Akun Anda sedang disuspend. Hubungi admin Skill Fusion.", "error");
      else if (code === "NOT_REGISTERED") showMessage("Email belum terdaftar. Pilih Register terlebih dahulu.", "warn");
      else showMessage(err.message || "Proses login gagal.", "error");
    } finally {
      setBusy(false);
    }
  }

  function renderGoogleButton() {
    if (!window.google || !google.accounts || !google.accounts.id || gisReady) return;
    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: handleGoogleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      ux_mode: "popup"
    });
    buttonHost.innerHTML = "";
    google.accounts.id.renderButton(buttonHost, {
      type: "standard",
      theme: "filled_black",
      size: "large",
      text: "continue_with",
      shape: "rectangular",
      width: Math.min(440, Math.max(260, buttonHost.clientWidth || 360))
    });
    gisReady = true;
  }

  root.querySelectorAll("[data-sfm-mode]").forEach(btn => btn.addEventListener("click", () => setMode(btn.dataset.sfmMode)));
  setMode("login");

  if (!configured()) showMessage("Konfigurasi backend & Google OAuth belum diisi.", "warn");

  if (window.google && window.google.accounts) {
    renderGoogleButton();
  } else {
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.defer = true;
    script.onload = renderGoogleButton;
    script.onerror = () => showMessage("Google Sign-In gagal dimuat. Coba refresh halaman.", "error");
    document.head.appendChild(script);
  }
})();
</script>
