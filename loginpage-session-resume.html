<!-- SKILL FUSION LOGINPAGE SESSION BRIDGE — REV333 -->
<style id="sfLoginResumeStyle">html.sf-login-session-check body{visibility:hidden!important}</style>
<script>
(()=>{
  "use strict";

  const API_URL="https://script.google.com/macros/s/AKfycbzUbx40vGvuCS4hQEOdfs-DeSU_TY-9zWXXPZzOKn3D9h0m5pQQYD6GGNCefufvsrv2eA/exec";
  const MEMBER_URL="https://skillfusion.framer.website/Memberarea";
  const RELAY_ORIGIN="https://wiliejonathan.github.io";
  const SESSION_KEY="sf_member_session";
  const EXPIRES_KEY="sf_member_expires_at";
  const EMAIL_KEY="sf_member_email";
  const ACTIVITY_KEY="sf_member_last_activity";
  const IDLE_MS=10*60*1000;

  document.documentElement.classList.add("sf-login-session-check");

  function stores(){
    const out=[];
    for(const s of [localStorage,sessionStorage]){
      try{if(s&&!out.includes(s))out.push(s)}catch(_){}
    }
    return out;
  }

  function read(key){
    for(const s of stores()){
      try{
        const v=String(s.getItem(key)||"").trim();
        if(v)return v;
      }catch(_){}
    }
    return "";
  }

  function writeSession(data){
    const token=String(data?.sessionToken||"").trim();
    if(!token)return false;
    const expires=String(data?.expiresAt||"").trim();
    const email=String(data?.member?.email||"").trim();
    const now=String(Date.now());
    stores().forEach(s=>{
      try{
        s.setItem(SESSION_KEY,token);
        if(expires)s.setItem(EXPIRES_KEY,expires);
        if(email)s.setItem(EMAIL_KEY,email);
        s.setItem(ACTIVITY_KEY,now);
      }catch(_){}
    });
    return true;
  }

  function clear(){
    stores().forEach(s=>{
      try{[SESSION_KEY,EXPIRES_KEY,EMAIL_KEY,ACTIVITY_KEY].forEach(k=>s.removeItem(k))}catch(_){}
    });
  }

  function reveal(){
    document.documentElement.classList.remove("sf-login-session-check");
    document.getElementById("sfLoginResumeStyle")?.remove();
  }

  async function validate(token){
    const c=new AbortController();
    const t=setTimeout(()=>c.abort(),10000);
    try{
      const r=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        cache:"no-store",
        redirect:"follow",
        signal:c.signal,
        body:JSON.stringify({
          action:"member_auth",
          command:"validate_session",
          sessionToken:token,
          userAgent:navigator.userAgent||""
        })
      });
      const raw=await r.text();
      const p=JSON.parse(raw||"{}");
      if(!r.ok||p.success===false||p.ok===false||p.valid===false)throw new Error(p.code||"SESSION_INVALID");
      return p;
    }finally{
      clearTimeout(t);
    }
  }

  async function acceptSession(data){
    const token=String(data?.sessionToken||"").trim();
    if(!token)return false;
    try{
      // Never trust an iframe message blindly. Validate the session with backend first.
      const checked=await validate(token);
      if(!checked?.valid)return false;
      writeSession({
        sessionToken:token,
        expiresAt:checked.expiresAt||data.expiresAt||"",
        member:checked.member||data.member||{}
      });
      // SECURITY: token is not placed in address bar.
      location.replace(MEMBER_URL);
      return true;
    }catch(_){
      clear();
      reveal();
      return false;
    }
  }

  window.addEventListener("message",event=>{
    const data=event.data||{};

    // Direct message from our GitHub Google-auth relay.
    if(event.origin===RELAY_ORIGIN && data.source==="skill-fusion-auth-relay"){
      if(data.ok && String(data.status||"").toUpperCase()==="ACTIVE")acceptSession(data);
      return;
    }

    // Handoff from the Framer HTML widget iframe. Origin can be Framer's embed origin,
    // therefore backend validation above is mandatory before accepting the token.
    if(data.source==="skill-fusion-widget-session" && String(data.status||"ACTIVE").toUpperCase()==="ACTIVE"){
      acceptSession(data);
    }
  });

  (async()=>{
    // Legacy #sf_token URLs are never accepted. Strip them immediately.
    if(/(?:^#|&)sf_token=/i.test(String(location.hash||""))){
      try{history.replaceState(null,document.title,location.pathname+location.search)}catch(_){}
    }

    const token=read(SESSION_KEY);
    if(!token){reveal();return}

    const last=Number(read(ACTIVITY_KEY)||0);
    if(last&&Date.now()-last>=IDLE_MS){
      clear();
      reveal();
      return;
    }

    try{
      const result=await validate(token);
      if(!result.valid)throw new Error("SESSION_INVALID");
      writeSession({sessionToken:token,expiresAt:result.expiresAt,member:result.member});
      location.replace(MEMBER_URL);
    }catch(_){
      clear();
      reveal();
    }
  })();
})();
</script>
